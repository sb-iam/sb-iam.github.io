<svg style="color:#101418;background:#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 504" role="img" aria-labelledby="f2-title f2-desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="currentColor" width="100%">
  <title id="f2-title">JITAC design: one graph for the four first-class languages, joined at the foreign function interface</title>
  <desc id="f2-desc">One box on the left, the Virtual Incremental Loader, keeps one graph for the four languages, loads a unit only when a call requires it, and joins a foreign call to its definition only if name and signature agree. Four language boxes on the right each carry an edge labeled FFI to the loader. Lean states an abstraction and its properties and is loaded one module at a time. Mojo computes it on CPUs and GPUs, through MLIR, and is loaded one package at a time. C++ connects it to LLVM and MLIR and is loaded one translation unit at a time. Rust connects it to Android and the Linux kernel and is loaded one crate at a time. Each language calls the others only through the FFI, under the C ABI. JITAC is a design under construction and has not yet been evaluated.</desc>
  <defs>
    <marker id="f2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/></marker>
    <style>
      .f2k  { font-size: 11.5px; font-weight: 750; letter-spacing: 0.09em; fill: #b8860b; text-anchor: middle; }
      .f2h  { font-size: 14.5px; font-weight: 750; letter-spacing: 0.03em; }
      .f2id { font-size: 12px; font-weight: 750; opacity: 0.5; }
      .f2r  { font-size: 12px; opacity: 0.84; }
      .f2e  { font-size: 11.5px; opacity: 0.62; text-anchor: middle; font-style: italic; }
      .f2c  { font-size: 12.5px; opacity: 0.72; text-anchor: middle; }
      .f2box{ fill: rgba(128,128,128,0.07); stroke-width: 1.3; }
      .f2sep{ stroke-width: 1; opacity: 0.4; }
      .f2link{ stroke: currentColor; stroke-width: 1.4; opacity: 0.6; fill: none; }
    </style>
  </defs>

  <text class="f2k" x="410" y="20">JITAC: ONE GRAPH FOR FOUR LANGUAGES</text>

  <g transform="translate(0,14)">
  <!-- Virtual Incremental Loader -->
  <rect class="f2box" x="16" y="154" width="292" height="132" rx="4" stroke="#b8860b" stroke-opacity="1" stroke-width="1.9" fill="rgba(184,134,11,0.07)"/>
  <text class="f2h" x="32" y="180" fill="#b8860b">VIRTUAL INCREMENTAL LOADER</text>
  <line class="f2sep" x1="32" y1="190" x2="292" y2="190" stroke="#b8860b"/>
  <text class="f2r" x="32" y="210">one graph for the four languages</text>
  <text class="f2r" x="32" y="229">loads a unit only when a call requires it</text>
  <text class="f2r" x="32" y="248">joins a foreign call to its definition</text>
  <text class="f2r" x="32" y="267">only if name and signature agree</text>

  <!-- 1 Lean -->
  <rect class="f2box" x="500" y="26" width="304" height="88" rx="4" stroke="#c44a37" stroke-opacity="0.9"/>
  <text class="f2id" x="516" y="52">1</text>
  <text class="f2h" x="536" y="52" fill="#c44a37">LEAN</text>
  <line class="f2sep" x1="516" y1="62" x2="788" y2="62" stroke="#c44a37"/>
  <text class="f2r" x="516" y="82">states an abstraction and its properties</text>
  <text class="f2r" x="516" y="101">loaded one module at a time</text>

  <!-- 2 Mojo -->
  <rect class="f2box" x="500" y="126" width="304" height="88" rx="4" stroke="#8b6fc0" stroke-opacity="0.9"/>
  <text class="f2id" x="516" y="152">2</text>
  <text class="f2h" x="536" y="152" fill="#8b6fc0">MOJO</text>
  <line class="f2sep" x1="516" y1="162" x2="788" y2="162" stroke="#8b6fc0"/>
  <text class="f2r" x="516" y="182">computes it on CPUs and GPUs, through MLIR</text>
  <text class="f2r" x="516" y="201">loaded one package at a time</text>

  <!-- 3 C++ -->
  <rect class="f2box" x="500" y="226" width="304" height="88" rx="4" stroke="#1fa8d6" stroke-opacity="0.9"/>
  <text class="f2id" x="516" y="252">3</text>
  <text class="f2h" x="536" y="252" fill="#1fa8d6">C++</text>
  <line class="f2sep" x1="516" y1="262" x2="788" y2="262" stroke="#1fa8d6"/>
  <text class="f2r" x="516" y="282">connects it to LLVM and MLIR</text>
  <text class="f2r" x="516" y="301">loaded one translation unit at a time</text>

  <!-- 4 Rust -->
  <rect class="f2box" x="500" y="326" width="304" height="88" rx="4" stroke="#4f9d69" stroke-opacity="0.9"/>
  <text class="f2id" x="516" y="352">4</text>
  <text class="f2h" x="536" y="352" fill="#4f9d69">RUST</text>
  <line class="f2sep" x1="516" y1="362" x2="788" y2="362" stroke="#4f9d69"/>
  <text class="f2r" x="516" y="382">connects it to Android and the Linux kernel</text>
  <text class="f2r" x="516" y="401">loaded one crate at a time</text>

  <!-- FFI edges: the foreign calls of each language, joined by the loader -->
  <path class="f2link" d="M500,70 C 430,70 380,166 312,178" marker-end="url(#f2-arrow)"/>
  <text class="f2e" x="406" y="99">FFI</text>

  <path class="f2link" d="M500,170 C 440,170 372,204 312,208" marker-end="url(#f2-arrow)"/>
  <text class="f2e" x="406" y="175">FFI</text>

  <path class="f2link" d="M500,270 C 440,270 372,236 312,232" marker-end="url(#f2-arrow)"/>
  <text class="f2e" x="406" y="271">FFI</text>

  <path class="f2link" d="M500,370 C 430,370 380,274 312,262" marker-end="url(#f2-arrow)"/>
  <text class="f2e" x="406" y="347">FFI</text>

  <text class="f2c" x="410" y="451">Each language calls the others only through the FFI, under the C ABI.</text>
  <text class="f2c" x="410" y="471">A design: JITAC is under construction and has not yet been evaluated.</text>
  </g>
</svg>
