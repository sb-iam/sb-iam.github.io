<svg style="color: #171b20; background: #ffffff;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 288" role="img" aria-labelledby="f2-title f2-desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="currentColor" width="100%">
                <title id="f2-title">VerifyD architecture: Rust control plane, Virtual Graph Loader, Mojo data plane</title>
                <desc id="f2-desc">Three planes, left to right. The Rust control plane holds auth and the Cedar gate, the IDE, ACP and CLI surfaces, the cloud SDK and receipts, and lifecycle and storage. The Virtual Graph Loader holds the typed program graph, evidence and identity, on-demand context, and sealed snapshots. The Mojo data plane holds inference through MAX, Nabla-Mojo training, RLVR loops, and analysis and evaluation. Work flows left to right, and a return arc carries evidence from the data plane back to the control plane, where authority stays.</desc>
                <defs>
                  <marker id="f2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/></marker>
                  <marker id="f2-arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b8860b"/></marker>
                  <style>
                    .f2k  { font-size: 11.5px; font-weight: 750; letter-spacing: 0.09em; fill: #b8860b; text-anchor: middle; }
                    .f2h  { font-size: 14.5px; font-weight: 750; letter-spacing: 0.03em; }
                    .f2id { font-size: 12px; font-weight: 750; opacity: 0.5; }
                    .f2r  { font-size: 12px; opacity: 0.84; }
                    .f2c  { font-size: 12.5px; opacity: 0.72; text-anchor: middle; }
                    .f2box{ fill: rgba(128,128,128,0.07); stroke-width: 1.3; }
                    .f2sep{ stroke-width: 1; opacity: 0.4; }
                    .f2link{ stroke: currentColor; stroke-width: 1.4; opacity: 0.6; fill: none; }
                    .f2ret { stroke: #b8860b; stroke-width: 1.4; opacity: 0.9; fill: none; }
                  </style>
                </defs>

                <text class="f2k" x="410" y="20">EVIDENCE RETURNS. AUTHORITY DOES NOT MOVE.</text>
                <path class="f2ret" d="M680,56 C 680,34 620,32 410,32 C 200,32 140,34 140,56" marker-end="url(#f2-arrow-gold)"/>

                <!-- 1 Rust control plane -->
                <rect class="f2box" x="16" y="56" width="248" height="152" rx="4" stroke="#1fa8d6" stroke-opacity="0.9"/>
                <text class="f2id" x="32" y="82">1</text>
                <text class="f2h" x="52" y="82" fill="#1fa8d6">RUST CONTROL PLANE</text>
                <line class="f2sep" x1="32" y1="92" x2="248" y2="92" stroke="#1fa8d6"/>
                <text class="f2r" x="32" y="114">Auth + Cedar gate</text>
                <text class="f2r" x="32" y="133">IDE / ACP / CLI</text>
                <text class="f2r" x="32" y="152">cloud SDK + receipts</text>
                <line class="f2sep" x1="32" y1="168" x2="248" y2="168" stroke="#1fa8d6"/>
                <text class="f2r" x="32" y="190">lifecycle + storage</text>

                <!-- 2 Virtual Graph Loader: the identity anchor -->
                <rect class="f2box" x="286" y="56" width="248" height="152" rx="4" stroke="#b8860b" stroke-opacity="1" stroke-width="1.9" fill="rgba(184,134,11,0.07)"/>
                <text class="f2id" x="302" y="82">2</text>
                <text class="f2h" x="322" y="82" fill="#b8860b">VIRTUAL GRAPH LOADER</text>
                <line class="f2sep" x1="302" y1="92" x2="518" y2="92" stroke="#b8860b"/>
                <text class="f2r" x="302" y="114">typed program graph</text>
                <text class="f2r" x="302" y="133">evidence + identity</text>
                <text class="f2r" x="302" y="152">on-demand context</text>
                <line class="f2sep" x1="302" y1="168" x2="518" y2="168" stroke="#b8860b"/>
                <text class="f2r" x="302" y="190">sealed snapshots</text>

                <!-- 3 Mojo data plane -->
                <rect class="f2box" x="556" y="56" width="248" height="152" rx="4" stroke="#8b6fc0" stroke-opacity="0.9"/>
                <text class="f2id" x="572" y="82">3</text>
                <text class="f2h" x="592" y="82" fill="#8b6fc0">MOJO DATA PLANE</text>
                <line class="f2sep" x1="572" y1="92" x2="788" y2="92" stroke="#8b6fc0"/>
                <text class="f2r" x="572" y="114">inference / MAX</text>
                <text class="f2r" x="572" y="133">Nabla-Mojo training</text>
                <text class="f2r" x="572" y="152">RLVR loops</text>
                <line class="f2sep" x1="572" y1="168" x2="788" y2="168" stroke="#8b6fc0"/>
                <text class="f2r" x="572" y="190">analysis + evaluation</text>

                <line class="f2link" x1="266" y1="132" x2="282" y2="132" marker-end="url(#f2-arrow)"/>
                <line class="f2link" x1="536" y1="132" x2="552" y2="132" marker-end="url(#f2-arrow)"/>

                <text class="f2c" x="410" y="250">The IDE, Cedar-Mojo, Nabla-Mojo, and the VGL are instruments.</text>
                <text class="f2c" x="410" y="270">The verification spine is the product.</text>
              </svg>
