<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" role="img" aria-labelledby="f3-title f3-desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="currentColor">
  <title id="f3-title">Four processes, one plan, one record</title>
  <desc id="f3-desc">Top: a band of frozen inputs read by every process: Program, policy, consent, fixture crate. Middle: four boxes joined by stdio arrows: H the MCP host, G an MCP stdio server that forwards, A an MCP stdio server that applies the patch and commits, B an MCP stdio server that runs one test and writes the summary. Under each box the same three parts: checks the whole plan, gates its exact bytes, keeps a synced journal. Below: the run directory written only by the processes: journals, retained frames, git workspace, summary, receipt. Bottom: two readers, the judge that re-derives the verdict from the run directory alone, and the live page that tails the journals and never writes.</desc>
  <defs>
    <marker id="f3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/></marker>
    <marker id="f3-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1fa8d6"/></marker>
    <style>
      .t  { font-size: 18px; font-weight: 600; }
      .s  { font-size: 13px; font-weight: 600; fill: #1fa8d6; }
      .n  { font-size: 15px; font-weight: 600; }
      .r  { font-size: 12.5px; opacity: 0.78; }
      .g  { font-size: 13px; opacity: 0.85; text-anchor: middle; }
      .band { fill: rgba(128,128,128,0.12); stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; }
      .proc { fill: rgba(128,128,128,0.08); stroke: currentColor; stroke-width: 1.4; }
      .sink { fill: rgba(31,168,214,0.12); stroke: currentColor; stroke-width: 1.4; }
      .dark { fill: rgba(128,128,128,0.22); stroke: currentColor; stroke-opacity: 0.6; stroke-width: 1.2; }
      .link { stroke: currentColor; stroke-width: 1.2; opacity: 0.6; fill: none; }
      .hop  { stroke: #1fa8d6; stroke-width: 2.4; fill: none; }
      .lbl  { font-size: 11.5px; font-weight: 600; fill: #1fa8d6; text-anchor: middle; }
    </style>
  </defs>

  <text class="t" x="12" y="25">Four processes, one plan, one record</text>

  <!-- frozen inputs -->
  <rect class="band" x="12" y="42" width="736" height="32" rx="6"/>
  <text class="g" x="380" y="63">frozen inputs, read by every process: Program · policy · consent · fixture crate</text>
  <line class="link" x1="100" y1="74" x2="100" y2="104" marker-end="url(#f3-arrow)"/>
  <line class="link" x1="287" y1="74" x2="287" y2="104" marker-end="url(#f3-arrow)"/>
  <line class="link" x1="474" y1="74" x2="474" y2="104" marker-end="url(#f3-arrow)"/>
  <line class="link" x1="661" y1="74" x2="661" y2="104" marker-end="url(#f3-arrow)"/>

  <!-- the four processes -->
  <rect class="proc" x="12" y="106" width="176" height="96" rx="6"/>
  <text class="s" x="22" y="126">H · MCP host</text>
  <text class="r" x="22" y="146">checks the plan before</text>
  <text class="r" x="22" y="162">its first call; one call</text>
  <text class="r" x="22" y="178">to G; re-hashes the receipt</text>

  <rect class="proc" x="199" y="106" width="176" height="96" rx="6"/>
  <text class="s" x="209" y="126">G · MCP stdio server 1</text>
  <text class="r" x="209" y="146">serves submit_fix to H;</text>
  <text class="r" x="209" y="162">forwards it to A through</text>
  <text class="r" x="209" y="178">its own gate</text>

  <rect class="proc" x="386" y="106" width="176" height="96" rx="6"/>
  <text class="s" x="396" y="126">A · MCP stdio server 2</text>
  <text class="r" x="396" y="146">applies the patch, makes</text>
  <text class="r" x="396" y="162">the git commit; asks B to</text>
  <text class="r" x="396" y="178">verify that commit</text>

  <rect class="sink" x="573" y="106" width="175" height="96" rx="6"/>
  <text class="s" x="583" y="126">B · MCP stdio server 3</text>
  <text class="r" x="583" y="146">runs exactly one cargo</text>
  <text class="r" x="583" y="162">test on it; writes the</text>
  <text class="r" x="583" y="178">summary once, a receipt</text>

  <line class="hop" x1="188" y1="150" x2="197" y2="150" marker-end="url(#f3-arrow-blue)"/>
  <line class="hop" x1="375" y1="150" x2="384" y2="150" marker-end="url(#f3-arrow-blue)"/>
  <line class="hop" x1="562" y1="150" x2="571" y2="150" marker-end="url(#f3-arrow-blue)"/>
  <text class="lbl" x="193" y="140">stdio</text>
  <text class="lbl" x="380" y="140">stdio</text>
  <text class="lbl" x="567" y="140">stdio</text>

  <!-- what every process has -->
  <text class="g" x="380" y="222">every process: checks the whole plan itself · gates the exact bytes it sends · keeps a synced, hash-chained journal</text>

  <line class="link" x1="100" y1="230" x2="100" y2="254" marker-end="url(#f3-arrow)"/>
  <line class="link" x1="287" y1="230" x2="287" y2="254" marker-end="url(#f3-arrow)"/>
  <line class="link" x1="474" y1="230" x2="474" y2="254" marker-end="url(#f3-arrow)"/>
  <line class="link" x1="661" y1="230" x2="661" y2="254" marker-end="url(#f3-arrow)"/>

  <!-- the run directory -->
  <rect class="dark" x="12" y="256" width="736" height="34" rx="6"/>
  <text class="g" x="380" y="278">the run directory, written only by the processes: journals · retained frames · git workspace · summary · receipt · panel</text>

  <line class="link" x1="190" y1="290" x2="190" y2="326" marker-end="url(#f3-arrow)"/>
  <line class="link" x1="570" y1="290" x2="570" y2="326" marker-end="url(#f3-arrow)"/>

  <!-- the two readers -->
  <rect class="band" x="12" y="328" width="356" height="80" rx="6"/>
  <text class="n" x="24" y="352">Judge</text>
  <text class="r" x="24" y="372">re-derives the verdict from the run directory alone,</text>
  <text class="r" x="24" y="388">against expectations frozen before the code; never runs the binary</text>

  <rect class="band" x="392" y="328" width="356" height="80" rx="6"/>
  <text class="n" x="404" y="352">Live page</text>
  <text class="r" x="404" y="372">tails the journals over loopback, one card per record;</text>
  <text class="r" x="404" y="388">prints the judge's line verbatim; never writes</text>
</svg>
