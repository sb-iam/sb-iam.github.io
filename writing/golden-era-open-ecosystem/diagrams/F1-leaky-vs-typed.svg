<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="100%" role="img" aria-labelledby="f1-title f1-desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="currentColor" stroke="currentColor">
  <title id="f1-title">Leaky pipeline versus typed-task pipeline</title>
  <desc id="f1-desc">Two vertical pipelines. Left, today's leaky flow: prompt, agent, Markdown handoff, agent, shell, filesystem, prose summary, with four leaks marked in red: ambient permission, untyped handoff, invisible effect, summary-as-evidence. Right, the typed-task flow: intent, Phi, a fork into obligations and policy that rejoins, typed handoff, effect-checked execution, evidence packet, acceptance, with four checks marked in cyan: bounded authority, typed interface, recorded and revertible effect, classed evidence.</desc>
  <defs>
    <marker id="f1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/></marker>
  </defs>

  <!-- Headers -->
  <g font-size="18" font-weight="600" text-anchor="middle" stroke="none">
    <text x="266" y="25">Today: leaky</text>
    <text x="497" y="25">Typed task: checked</text>
  </g>
  <line x1="206" y1="35" x2="326" y2="35" stroke="#c44a37" stroke-width="2"/>
  <line x1="403" y1="35" x2="591" y2="35" stroke="#1fa8d6" stroke-width="2"/>

  <!-- ===== LEFT PIPELINE (box x 178..354, centre 266) ===== -->
  <g stroke-width="1.2">
    <!-- boxes -->
    <rect x="178" y="48"  width="176" height="36" rx="6" fill="rgba(128,128,128,0.12)"/>
    <rect x="178" y="120" width="176" height="36" rx="6" fill="rgba(128,128,128,0.12)"/>
    <rect x="178" y="194" width="176" height="36" rx="6" fill="rgba(196,74,55,0.16)" stroke="#c44a37" stroke-width="1.6"/>
    <rect x="178" y="268" width="176" height="36" rx="6" fill="rgba(196,74,55,0.16)" stroke="#c44a37" stroke-width="1.6"/>
    <rect x="178" y="349" width="176" height="36" rx="6" fill="rgba(196,74,55,0.16)" stroke="#c44a37" stroke-width="1.6"/>
    <rect x="178" y="430" width="176" height="36" rx="6" fill="rgba(128,128,128,0.12)"/>
    <rect x="178" y="502" width="176" height="36" rx="6" fill="rgba(196,74,55,0.16)" stroke="#c44a37" stroke-width="1.6"/>
    <!-- arrows -->
    <line x1="266" y1="84"  x2="266" y2="119" marker-end="url(#f1-arr)" stroke-width="1.5"/>
    <line x1="266" y1="156" x2="266" y2="193" marker-end="url(#f1-arr)" stroke-dasharray="4 3" stroke-width="1.5"/>
    <line x1="266" y1="230" x2="266" y2="267" marker-end="url(#f1-arr)" stroke-dasharray="4 3" stroke-width="1.5"/>
    <line x1="266" y1="304" x2="266" y2="348" marker-end="url(#f1-arr)" stroke-width="1.5"/>
    <line x1="266" y1="385" x2="266" y2="429" marker-end="url(#f1-arr)" stroke-width="1.5"/>
    <line x1="266" y1="466" x2="266" y2="501" marker-end="url(#f1-arr)" stroke-width="1.5"/>
  </g>
  <g font-size="15" text-anchor="middle" stroke="none">
    <text x="266" y="71">prompt</text>
    <text x="266" y="143">agent</text>
    <text x="266" y="217">Markdown handoff</text>
    <text x="266" y="291">agent</text>
    <text x="266" y="372">shell</text>
    <text x="266" y="453">filesystem</text>
    <text x="266" y="525">prose summary</text>
  </g>
  <!-- leak markers -->
  <g fill="#c44a37" stroke="none">
    <circle cx="164" cy="212" r="5"/>
    <circle cx="164" cy="286" r="5"/>
    <circle cx="164" cy="367" r="5"/>
    <circle cx="164" cy="520" r="5"/>
  </g>
  <g font-size="14" text-anchor="end" stroke="none" opacity="0.78">
    <text x="150" y="217">untyped handoff</text>
    <text x="150" y="291">ambient permission</text>
    <text x="150" y="372">invisible effect</text>
    <text x="150" y="525">summary-as-evidence</text>
  </g>

  <!-- ===== RIGHT PIPELINE (box x 384..610, centre 497) ===== -->
  <g stroke-width="1.2" fill="none">
    <!-- boxes -->
    <rect x="384" y="48"  width="226" height="36" rx="6" fill="rgba(128,128,128,0.12)"/>
    <rect x="384" y="120" width="226" height="36" rx="6" fill="rgba(128,128,128,0.12)"/>
    <rect x="384" y="194" width="112" height="36" rx="6" fill="rgba(128,128,128,0.12)"/>
    <rect x="530" y="194" width="80"  height="36" rx="6" fill="rgba(31,168,214,0.16)" stroke="#1fa8d6" stroke-width="1.6"/>
    <rect x="384" y="268" width="226" height="36" rx="6" fill="rgba(31,168,214,0.16)" stroke="#1fa8d6" stroke-width="1.6"/>
    <rect x="384" y="340" width="226" height="54" rx="6" fill="rgba(31,168,214,0.16)" stroke="#1fa8d6" stroke-width="1.6"/>
    <rect x="384" y="430" width="226" height="36" rx="6" fill="rgba(31,168,214,0.16)" stroke="#1fa8d6" stroke-width="1.6"/>
    <rect x="384" y="502" width="226" height="36" rx="6" fill="rgba(128,128,128,0.12)"/>
    <!-- trunk arrow -->
    <line x1="497" y1="84"  x2="497" y2="119" marker-end="url(#f1-arr)" stroke-width="1.5"/>
    <!-- fork -->
    <path d="M497,156 V174 H440 V193" marker-end="url(#f1-arr)" stroke-width="1.5"/>
    <path d="M497,156 V174 H570 V193" marker-end="url(#f1-arr)" stroke-width="1.5"/>
    <!-- rejoin -->
    <path d="M440,230 V248 H570 V230" stroke-width="1.5"/>
    <line x1="497" y1="248" x2="497" y2="267" marker-end="url(#f1-arr)" stroke-width="1.5"/>
    <line x1="497" y1="304" x2="497" y2="339" marker-end="url(#f1-arr)" stroke-width="1.5"/>
    <line x1="497" y1="394" x2="497" y2="429" marker-end="url(#f1-arr)" stroke-width="1.5"/>
    <line x1="497" y1="466" x2="497" y2="501" marker-end="url(#f1-arr)" stroke-width="1.5"/>
  </g>
  <g font-size="15" text-anchor="middle" stroke="none">
    <text x="497" y="71">intent</text>
    <text x="497" y="144" font-size="18" font-weight="600">Φ</text>
    <text x="440" y="217">obligations</text>
    <text x="513" y="217" font-size="14" opacity="0.78">and</text>
    <text x="570" y="217">policy</text>
    <text x="497" y="291">typed handoff</text>
    <text x="497" y="362">effect-checked</text>
    <text x="497" y="380">execution</text>
    <text x="497" y="453">evidence packet</text>
    <text x="497" y="525">acceptance</text>
  </g>
  <!-- check markers -->
  <g fill="#1fa8d6" stroke="none">
    <circle cx="624" cy="212" r="5"/>
    <circle cx="624" cy="286" r="5"/>
    <circle cx="624" cy="367" r="5"/>
    <circle cx="624" cy="448" r="5"/>
  </g>
  <g font-size="14" text-anchor="start" stroke="none" opacity="0.78">
    <text x="637" y="217">bounded authority</text>
    <text x="637" y="291">typed interface</text>
    <text x="637" y="362">recorded +</text>
    <text x="637" y="379">revertible effect</text>
    <text x="637" y="453">classed evidence</text>
  </g>
</svg>
