<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="100%" role="img" aria-labelledby="f3-title f3-desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="currentColor">
  <title id="f3-title">The AI layer cake for agentic software</title>
  <desc id="f3-desc">Six layers from human intent down to evidence, each stating what it commits, its open reference, and whether it must be open or may be closed; a vertical arrow marks progressive commitment; a shaded band below marks cloud, chips and energy as out of scope.</desc>
  <defs>
    <marker id="f3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/></marker>
    <style>
      .t  { font-size: 16px; font-weight: 600; }
      .h  { font-size: 12px; font-weight: 600; opacity: 0.6; letter-spacing: 0.04em; }
      .n  { font-size: 13px; font-weight: 600; }
      .c  { font-size: 13px; }
      .r  { font-size: 12px; opacity: 0.78; }
      .p  { font-size: 12px; text-anchor: middle; }
      .g  { font-size: 12px; opacity: 0.8; text-anchor: middle; }
      .b  { font-size: 13px; opacity: 0.85; text-anchor: middle; }
      .band { fill: rgba(128,128,128,0.12); stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; }
      .open  { fill: rgba(31,168,214,0.16); stroke: #1fa8d6; stroke-width: 1.2; }
      .either{ fill: rgba(199,131,7,0.16);  stroke: #c78307; stroke-width: 1.2; }
      .rule  { stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1; }
    </style>
  </defs>

  <!-- title -->
  <text class="t" x="34" y="30">The AI layer cake for agentic software</text>

  <!-- column headers -->
  <text class="h" x="46"  y="58">LAYER</text>
  <text class="h" x="188" y="58">COMMITS</text>
  <text class="h" x="411" y="58">OPEN REFERENCE</text>
  <text class="h" x="744" y="58" text-anchor="end">OPENNESS</text>
  <line class="rule" x1="34" y1="64" x2="754" y2="64"/>

  <!-- left gutter: progressive commitment -->
  <line x1="24" y1="72" x2="24" y2="466" stroke="currentColor" stroke-width="1.5" marker-end="url(#f3-arrow)"/>
  <text class="g" transform="rotate(-90 14 270)" x="14" y="270">progressive commitment</text>

  <!-- L1 Human intent: y=70 -->
  <rect class="band" x="34" y="70" width="720" height="60" rx="6"/>
  <text class="n" x="46" y="104.5">Human intent</text>
  <text class="c" x="188" y="104.5">what was asked; who accepts risk</text>
  <text class="r" x="411" y="104.5">—</text>
  <rect class="either" x="682" y="89" width="62" height="22" rx="11"/>
  <text class="p" x="713" y="104.3">either</text>

  <!-- L2 Formal intent & policy: y=138 -->
  <rect class="band" x="34" y="138" width="720" height="60" rx="6"/>
  <text class="n" x="46" y="163">Formal intent</text>
  <text class="n" x="46" y="180">&amp; policy</text>
  <text class="c" x="188" y="163">Φ: authority bounded,</text>
  <text class="c" x="188" y="180">obligations stated</text>
  <text class="r" x="411" y="172.5">Cedar · autoformalization · CSLib</text>
  <rect class="open" x="644" y="157" width="100" height="22" rx="11"/>
  <text class="p" x="694" y="172.3">must be open</text>

  <!-- L3 Agent harness: y=206 -->
  <rect class="band" x="34" y="206" width="720" height="60" rx="6"/>
  <text class="n" x="46" y="231">Agent harness</text>
  <text class="n" x="46" y="248">(runtime)</text>
  <text class="c" x="188" y="231">effects recorded with inverses;</text>
  <text class="c" x="188" y="248">model-visible ⇒ logged</text>
  <text class="r" x="411" y="231">DeepSeek Harness ·</text>
  <text class="r" x="411" y="247">Cordis · ACP</text>
  <rect class="open" x="636" y="212" width="108" height="22" rx="11"/>
  <text class="p" x="690" y="227.3">interface open</text>
  <rect class="either" x="589" y="238" width="155" height="22" rx="11"/>
  <text class="p" x="666.5" y="253.3">implementation either</text>

  <!-- L4 Compiler & language: y=274 -->
  <rect class="band" x="34" y="274" width="720" height="60" rx="6"/>
  <text class="n" x="46" y="299">Compiler</text>
  <text class="n" x="46" y="316">&amp; language</text>
  <text class="c" x="188" y="299">structure checked;</text>
  <text class="c" x="188" y="316">analysis hooks before lowering</text>
  <text class="r" x="411" y="308.5">Mojo · MLIR · LLVM</text>
  <rect class="open" x="636" y="280" width="108" height="22" rx="11"/>
  <text class="p" x="690" y="295.3">interface open</text>
  <rect class="either" x="589" y="306" width="155" height="22" rx="11"/>
  <text class="p" x="666.5" y="321.3">implementation either</text>

  <!-- L5 Executable system: y=342 -->
  <rect class="band" x="34" y="342" width="720" height="60" rx="6"/>
  <text class="n" x="46" y="376.5">Executable system</text>
  <text class="c" x="188" y="367">behaviour observed;</text>
  <text class="c" x="188" y="384">traces produced</text>
  <text class="r" x="411" y="376.5">Zed as control plane · CLI</text>
  <rect class="either" x="682" y="361" width="62" height="22" rx="11"/>
  <text class="p" x="713" y="376.3">either</text>

  <!-- L6 Evidence / witness: y=410 -->
  <rect class="band" x="34" y="410" width="720" height="60" rx="6"/>
  <text class="n" x="46" y="444.5">Evidence / witness</text>
  <text class="c" x="188" y="435">proved · tested · observed ·</text>
  <text class="c" x="188" y="452">judged · assumed</text>
  <text class="r" x="411" y="444.5">portable formats</text>
  <rect class="open" x="644" y="429" width="100" height="22" rx="11"/>
  <text class="p" x="694" y="444.3">must be open</text>

  <!-- below the boundary -->
  <rect x="34" y="488" width="720" height="36" rx="6" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="4 3"/>
  <text class="b" x="394" y="510.5">cloud · chips · energy — below this series' boundary</text>
</svg>
