<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" role="img" aria-labelledby="f5-title f5-desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="currentColor">
  <title id="f5-title">From intent to acceptance</title>
  <desc id="f5-desc">Top-to-bottom graph: human intent becomes a natural-language task, is autoformalized, forks into an authorization policy (who may do what) and semantic obligations (what must remain true), rejoins in the agent harness with typed context, tools and effects, produces a repository mutation checked by compiler, analyzer and tests, yields evidence (proof, trace, test result, review packet, counterexample) and ends in human acceptance. A single feedback edge returns a refuted counterexample to autoformalization as a regression fixture.</desc>
  <defs>
    <marker id="f5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/></marker>
    <marker id="f5-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c44a37"/></marker>
  </defs>

  <!-- main flow edges -->
  <g fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#f5-arrow)">
    <line x1="340" y1="48" x2="340" y2="71"/>
    <line x1="340" y1="104" x2="340" y2="127"/>
    <line x1="340" y1="306" x2="340" y2="331"/>
    <line x1="340" y1="364" x2="340" y2="387"/>
    <line x1="340" y1="420" x2="340" y2="443"/>
    <line x1="340" y1="492" x2="340" y2="517"/>
    <!-- fork -->
    <path d="M340,160 V173 H215 V185"/>
    <path d="M340,160 V173 H465 V185"/>
    <!-- rejoin -->
    <path d="M215,232 V246 H340 V259"/>
    <path d="M465,232 V246 H340 V259"/>
  </g>

  <!-- feedback edge: counterexample -> autoformalization -->
  <path d="M562,468 H610 V144 H461" fill="none" stroke="#c44a37" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#f5-arrow-red)"/>
  <text x="618" y="298" font-size="13" font-weight="600" fill="#c44a37">
    <tspan x="618" dy="0">refuted →</tspan>
    <tspan x="618" dy="17">regression fixture</tspan>
  </text>

  <!-- 1 human intent -->
  <rect x="250" y="16" width="180" height="32" rx="16" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-width="1.2"/>
  <text x="340" y="37" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">human intent</text>

  <!-- 2 natural-language task -->
  <rect x="220" y="72" width="240" height="32" rx="6" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-width="1.2"/>
  <text x="340" y="93" font-size="13" text-anchor="middle" fill="currentColor">natural-language task</text>

  <!-- 3 autoformalization -->
  <rect x="220" y="128" width="240" height="32" rx="6" fill="rgba(31,168,214,0.16)" stroke="#1fa8d6" stroke-width="1.6"/>
  <text x="340" y="149" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">autoformalization</text>

  <!-- 4 fork -->
  <rect x="110" y="186" width="210" height="46" rx="6" fill="rgba(31,168,214,0.16)" stroke="#1fa8d6" stroke-width="1.6"/>
  <text x="215" y="205" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">authorization policy</text>
  <text x="215" y="223" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.8">who may do what</text>

  <rect x="360" y="186" width="210" height="46" rx="6" fill="rgba(31,168,214,0.16)" stroke="#1fa8d6" stroke-width="1.6"/>
  <text x="465" y="205" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">semantic obligations</text>
  <text x="465" y="223" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.8">what must remain true</text>

  <!-- 5 agent harness -->
  <rect x="200" y="260" width="280" height="46" rx="6" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-width="1.2"/>
  <text x="340" y="279" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">agent harness</text>
  <text x="340" y="297" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.8">typed context · tools · effects</text>

  <!-- 6 repository mutation -->
  <rect x="220" y="332" width="240" height="32" rx="6" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-width="1.2"/>
  <text x="340" y="353" font-size="13" text-anchor="middle" fill="currentColor">repository mutation</text>

  <!-- 7 compiler · analyzer · tests -->
  <rect x="220" y="388" width="240" height="32" rx="6" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-width="1.2"/>
  <text x="340" y="409" font-size="13" text-anchor="middle" fill="currentColor">compiler · analyzer · tests</text>

  <!-- 8 evidence -->
  <rect x="110" y="444" width="460" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g font-size="12" text-anchor="middle" fill="currentColor">
    <rect x="122" y="457" width="50" height="22" rx="11" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-width="1.2"/>
    <text x="147" y="472.3">proof</text>
    <rect x="182" y="457" width="50" height="22" rx="11" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-width="1.2"/>
    <text x="207" y="472.3">trace</text>
    <rect x="242" y="457" width="90" height="22" rx="11" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-width="1.2"/>
    <text x="287" y="472.3">test result</text>
    <rect x="342" y="457" width="102" height="22" rx="11" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-width="1.2"/>
    <text x="393" y="472.3">review packet</text>
    <rect x="454" y="457" width="108" height="22" rx="11" fill="rgba(196,74,55,0.16)" stroke="#c44a37" stroke-width="1.2"/>
    <text x="508" y="472.3">counterexample</text>
  </g>

  <!-- 9 human acceptance -->
  <rect x="250" y="518" width="180" height="32" rx="16" fill="rgba(128,128,128,0.12)" stroke="currentColor" stroke-width="1.2"/>
  <text x="340" y="539" font-size="13" font-weight="600" text-anchor="middle" fill="currentColor">human acceptance</text>
</svg>
