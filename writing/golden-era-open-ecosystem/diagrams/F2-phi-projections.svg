<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img" aria-labelledby="f2-title f2-desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="currentColor">
  <title id="f2-title">Φ and its four projections</title>
  <desc id="f2-desc">The typed task object Φ = ⟨Pre, Post, Inv, Cap, Effects, Evidence⟩ sits at the centre. Four arrows project its components outward: Cap and Effects become an authorization policy in Cedar where forbid overrides permit; Pre, Post and Inv become obligations discharged by tests, static analysis or proof; Effects become a runtime effect check in the harness that records and reverts; Evidence becomes the witness packet labelled proved, tested, observed, judged or assumed. Caption: authorization and verification are two projections of one typed object.</desc>
  <defs>
    <marker id="f2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/></marker>
  </defs>

  <!-- projection boxes -->
  <g stroke="currentColor" stroke-width="1.2" fill="rgba(128,128,128,0.12)">
    <rect x="20" y="20" width="320" height="78" rx="6"/>
    <rect x="420" y="20" width="320" height="78" rx="6"/>
    <rect x="20" y="352" width="320" height="78" rx="6"/>
    <rect x="420" y="352" width="320" height="78" rx="6"/>
  </g>

  <!-- centre: Φ -->
  <rect x="180" y="198" width="400" height="58" rx="6" stroke="#1fa8d6" stroke-width="1.6" fill="rgba(31,168,214,0.16)"/>
  <text x="380" y="233" font-size="16" font-weight="600" text-anchor="middle">Φ = ⟨Pre, Post, Inv, Cap, Effects, Evidence⟩</text>

  <!-- arrows -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)">
    <line x1="240" y1="198" x2="198" y2="102"/>
    <line x1="520" y1="198" x2="562" y2="102"/>
    <line x1="240" y1="256" x2="198" y2="348"/>
    <line x1="520" y1="256" x2="562" y2="348"/>
  </g>

  <!-- arrow labels: which components project -->
  <g font-size="13">
    <text x="236" y="154">Cap + Effects</text>
    <text x="524" y="154" text-anchor="end">Pre, Post, Inv</text>
    <text x="236" y="308">Effects</text>
    <text x="524" y="308" text-anchor="end">Evidence</text>
  </g>

  <!-- top-left: Authorization -->
  <text x="180" y="50" font-size="15" font-weight="600" text-anchor="middle">Authorization</text>
  <text x="180" y="76" font-size="13" text-anchor="middle">Cedar policy · forbid overrides permit</text>

  <!-- top-right: Obligations -->
  <text x="580" y="50" font-size="15" font-weight="600" text-anchor="middle">Obligations</text>
  <text x="580" y="76" font-size="13" text-anchor="middle">tests · static analysis · proof</text>

  <!-- bottom-left: Runtime effect check -->
  <text x="180" y="382" font-size="15" font-weight="600" text-anchor="middle">Runtime effect check</text>
  <text x="180" y="408" font-size="13" text-anchor="middle">harness records + reverts</text>

  <!-- bottom-right: Witness -->
  <text x="580" y="378" font-size="15" font-weight="600" text-anchor="middle">Witness</text>
  <text x="580" y="399" font-size="13" text-anchor="middle">evidence packet:</text>
  <text x="580" y="418" font-size="13" text-anchor="middle">proved · tested · observed · judged · assumed</text>

  <!-- caption -->
  <text x="380" y="458" font-size="13" font-style="italic" text-anchor="middle">Authorization and verification are two projections of one typed object.</text>
</svg>
