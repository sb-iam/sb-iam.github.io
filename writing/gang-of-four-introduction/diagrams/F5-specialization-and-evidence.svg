<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 558" width="100%" role="img" aria-labelledby="gi3-title gi3-desc" fill="currentColor" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="gi3-title">Specialization and verification establish different facts</title><desc id="gi3-desc">Top: a general program and known inputs enter partial evaluation, producing a residual program for the remaining inputs. A separate preservation obligation requires agreement under the chosen semantics. Bottom: static reasoning states properties and assumptions; runtime observation identifies selected artifacts and checks monitored conditions. Hybrid analysis relates them without converting observations into a universal proof.</desc><defs><style>.gi3-title{font-size:23px;font-weight:650} .gi3-head{font-size:17px;font-weight:650;fill:#159bc7} .gi3-body{font-size:15px} .gi3-small{font-size:13px;opacity:.8} .gi3-gold{fill:#ad7d13} .gi3-box{fill:rgba(128,128,128,.07);stroke:currentColor;stroke-opacity:.4;stroke-width:1.2} .gi3-blue{fill:rgba(31,168,214,.08);stroke:#159bc7;stroke-width:1.3} .gi3-proposal{fill:rgba(184,134,11,.06);stroke:#ad7d13;stroke-dasharray:7 5;stroke-width:1.4} .gi3-line{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.65}</style><marker id="gi3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/></marker></defs><text class="gi3-title" x="20" y="32">Specialization and verification establish different facts</text><text class="gi3-small" x="20" y="58">An illustrative workflow, not an implemented verification pipeline.</text><rect class="gi3-box" x="20" y="85" width="260" height="112" rx="7"/><text class="gi3-head" x="36" y="114">General program</text><text class="gi3-body" x="36" y="144">Known inputs: type, dimensions</text><text class="gi3-body" x="36" y="167">Remaining inputs: matrix values</text><path class="gi3-line" d="M280,141 L348,141" marker-end="url(#gi3-arrow)"/><rect class="gi3-blue" x="350" y="85" width="260" height="112" rx="7"/><text class="gi3-head" x="366" y="114">Partial evaluation</text><text class="gi3-body" x="366" y="144">Fix the known inputs</text><text class="gi3-body" x="366" y="167">Preserve program meaning</text><path class="gi3-line" d="M610,141 L678,141" marker-end="url(#gi3-arrow)"/><rect class="gi3-box" x="680" y="85" width="260" height="112" rx="7"/><text class="gi3-head" x="696" y="114">Residual program</text><text class="gi3-body" x="696" y="144">Receives the remaining inputs</text><text class="gi3-body" x="696" y="167">Still has correctness obligations</text><rect class="gi3-box" x="20" y="229" width="920" height="66" rx="7"/><text class="gi3-head" x="38" y="256">Preservation obligation</text><text class="gi3-body" x="38" y="281">For the remaining inputs, the residual program must agree with the original under the chosen semantics.</text><rect class="gi3-box" x="20" y="327" width="440" height="120" rx="7"/><text class="gi3-head" x="36" y="356">Static reasoning</text><text class="gi3-body" x="36" y="386">State a property and its assumptions</text><text class="gi3-body" x="36" y="409">Prove or analyze the supported representation</text><rect class="gi3-box" x="500" y="327" width="440" height="120" rx="7"/><text class="gi3-head" x="516" y="356">Runtime observation</text><text class="gi3-body" x="516" y="386">Identify selected artifacts and monitored inputs</text><text class="gi3-body" x="516" y="409">Check whether monitored assumptions hold</text><path class="gi3-line" d="M460,389 L498,389" marker-end="url(#gi3-arrow)"/><rect class="gi3-blue" x="20" y="475" width="920" height="65" rx="7"/><text class="gi3-body" x="38" y="502">Hybrid analysis relates the static model to observed executions.</text><text class="gi3-small" x="38" y="526">An observed run does not prove unobserved executions or the correctness of the specializer.</text></svg>