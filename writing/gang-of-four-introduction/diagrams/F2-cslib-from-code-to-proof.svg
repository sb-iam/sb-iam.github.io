<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 628" width="100%" role="img" aria-labelledby="gics-title gics-desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="currentColor">
  <title id="gics-title">CSLib and Boole IVL: theories, prototype and proposed Mojo connection</title>
  <desc id="gics-desc">Adapted from Figure 5 of the CSLib white paper, with a uniform row for the front-end languages in the paper’s vision. Separate status notes use repository documentation checked on 3 November 2026. The left pillar shows reusable computer-science theories built on Mathlib. The right pillar shows the envisioned route from source programs to Boole: intermediate verification language, then verification conditions and Lean proofs. A documented Rust/Verus prototype uses trusted translation for one function. Boole compiles to Strata Core; its SMT-level route still trusts verification-condition generation, SMT encoding and the lifting into Lean. The shallow route through Loom and Velvet is envisioned integration, although those projects exist independently. The paper lists five prover families; this does not assert that all five are connected to Boole. Mojo is the author-proposed connection, not a language named by the paper or an implementation supplied by this work. Generated-condition proofs must not be confused with a proof of source-program correctness.</desc>
  <defs>
    <marker id="gics-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor" /></marker>
    <marker id="gics-arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b8860b" /></marker>
