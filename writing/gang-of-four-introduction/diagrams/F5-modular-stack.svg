<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" width="100%" role="img" aria-labelledby="gimod-title gimod-desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="currentColor">
  <title id="gimod-title">The Modular Stack</title>
  <desc id="gimod-desc">The Modular stack in seven layers: frameworks, framework dialects, graph compiler, kernel compiler, kernel graph, runtime and hardware. MAP performs kernel fusion before MOGG code generation. Mojo compiles kernels, and MEF carries the model executable to the runtime. Framework and hardware boxes reproduce the documentation’s architectural view. The colours follow the documentation’s diagram, and their reading as representations, components and hardware is our inference; the document does not state it.</desc>
  <defs>
    <marker id="gimod-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor" /></marker>
    <style>
      .gimod-t  { font-size: 18px; font-weight: 600; }
      .gimod-s  { font-size: 13px; font-weight: 600; }
      .gimod-r  { font-size: 12.5px; opacity: 0.78; }
      .gimod-c  { font-size: 12.5px; fill: #1f1f1f; text-anchor: middle; }
      .gimod-n  { font-size: 11.5px; opacity: 0.7; }
      .gimod-lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; opacity: 0.66; }
      .gimod-band { fill: rgba(128,128,128,0.06); stroke: currentColor; stroke-opacity: 0.35; stroke-width: 1.2; }
      .gimod-box { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.1; }
      .gimod-hw { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.1; }
      .gimod-leg { font-size: 11.5px; opacity: 0.75; }
      .gimod-rep { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.1; }
      .gimod-key { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.1; }
      .gimod-link { stroke: currentColor; stroke-width: 1.2; opacity: 0.6; fill: none; }
      .gimod-ord { fill: #159bc7; }
      .gimod-ordt { font-size: 8.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .gimod-brace { stroke: currentColor; stroke-width: 1.2; opacity: 0.5; fill: none; }
    </style>
  </defs>

  <text class="gimod-t" x="12" y="25">The Modular Stack</text>
  <rect class="gimod-band" x="12" y="58" width="562" height="46" rx="6" />
  <text class="gimod-s" x="22" y="86">Framework</text>
  <rect class="gimod-rep" x="124" y="66" width="130" height="30" rx="15" /><text class="gimod-c" x="189" y="85">TensorFlow op graph</text>
  <rect class="gimod-rep" x="262" y="66" width="120" height="30" rx="15" /><text class="gimod-c" x="322" y="85">PyTorch op graph</text>
  <rect class="gimod-rep" x="390" y="66" width="176" height="30" rx="15" /><text class="gimod-c" x="478" y="85">XGBoost, scikit-learn</text>
  <text class="gimod-n" x="586" y="70">MAX Graph API in Python:</text>
  <text class="gimod-n" x="586" y="84">supported public IR producer</text>
  <rect class="gimod-band" x="12" y="110" width="562" height="46" rx="6" />
  <text class="gimod-s" x="22" y="138">Framework dialects</text>
  <rect class="gimod-box" x="262" y="118" width="100" height="30" rx="6" /><text class="gimod-c" x="312" y="137">MTFL dialect</text>
  <rect class="gimod-box" x="370" y="118" width="90" height="30" rx="6" /><text class="gimod-c" x="415" y="137">TF dialect</text>
  <rect class="gimod-box" x="468" y="118" width="98" height="30" rx="6" /><text class="gimod-c" x="517" y="137">others</text>
  <text class="gimod-n" x="586" y="131">MAX Graph API</text>
  <text class="gimod-n" x="586" y="145">builds the MO graph directly</text>

  
  <rect class="gimod-band" x="12" y="162" width="562" height="130" rx="6" />
  <text class="gimod-s" x="22" y="190">Graph compiler</text>
  <rect class="gimod-box" x="262" y="170" width="304" height="26" rx="6" /><text class="gimod-c" x="414" y="187">graph importer</text>
  <rect class="gimod-rep" x="262" y="200" width="148" height="26" rx="13" /><text class="gimod-c" x="336" y="217">RMO representation</text>
  <rect class="gimod-rep" x="418" y="200" width="148" height="26" rx="13" /><text class="gimod-c" x="492" y="217">MO representation</text>
  <rect class="gimod-rep" x="262" y="230" width="148" height="26" rx="13" /><text class="gimod-c" x="336" y="247">MAP representation</text>
  <rect class="gimod-box" x="418" y="230" width="148" height="26" rx="6" /><text class="gimod-c" x="492" y="247">kernel fusion</text>
  <rect class="gimod-rep" x="262" y="260" width="148" height="26" rx="13" /><text class="gimod-c" x="336" y="277">MOGG representation</text>
  <rect class="gimod-box" x="418" y="260" width="148" height="26" rx="6" /><text class="gimod-c" x="492" y="277">kernel code generation</text>
  <text class="gimod-n" x="586" y="203">C++ on MLIR</text>
  <text class="gimod-n" x="586" y="217">public path: MO, MAP,</text>
  <text class="gimod-n" x="586" y="231">MOGG, MGP, in that order,</text>
  <text class="gimod-n" x="586" y="245">MO optimizations; MAP fusion</text>
  <rect class="gimod-band" x="12" y="298" width="562" height="46" rx="6" />
  <text class="gimod-s" x="22" y="326">Kernel compiler</text>
  <rect class="gimod-box" x="262" y="306" width="148" height="30" rx="6" /><text class="gimod-c" x="336" y="325">KGEN, generated kernels</text>
  <rect class="gimod-key" x="418" y="306" width="148" height="30" rx="6" /><text class="gimod-c" x="492" y="325">hand-written kernels</text>
  <text class="gimod-n" x="586" y="318">Mojo kernel implementations,</text>
  <text class="gimod-n" x="586" y="332">compiled by Mojo</text>

  
  <rect class="gimod-band" x="12" y="350" width="562" height="78" rx="6" />
  <text class="gimod-s" x="22" y="394">Kernel graph</text>
  <rect class="gimod-rep" x="262" y="356" width="304" height="20" rx="10" /><text class="gimod-c" x="414" y="370">MGP representation</text>
  <rect class="gimod-box" x="262" y="379" width="304" height="20" rx="6" /><text class="gimod-c" x="414" y="393">graph exporter, MLIR to MEF</text>
  <rect class="gimod-rep" x="262" y="402" width="304" height="20" rx="10" /><text class="gimod-c" x="414" y="416">MEF: the bytes that cross to the runtime</text>
  <text class="gimod-n" x="586" y="386">C++</text>
  <text class="gimod-n" x="586" y="400">MEF: model-executable</text>
  <text class="gimod-n" x="586" y="414">boundary, even in-process</text>

  
  <rect class="gimod-band" x="12" y="434" width="562" height="70" rx="6" />
  <text class="gimod-s" x="22" y="474">Runtime</text>
  <rect class="gimod-box" x="262" y="440" width="304" height="18" rx="6" /><text class="gimod-c" x="414" y="453">GraphRT</text>
  <rect class="gimod-box" x="262" y="461" width="304" height="18" rx="6" /><text class="gimod-c" x="414" y="474">AsyncRT: AsyncValue, concurrent work queue</text>
  <rect class="gimod-box" x="262" y="482" width="304" height="18" rx="6" /><text class="gimod-c" x="414" y="495">Driver: DeviceContext</text>
  <text class="gimod-n" x="586" y="455">C++ runtime and driver</text>
  <text class="gimod-n" x="586" y="469">host scheduling and I/O;</text>
  <text class="gimod-n" x="586" y="483">HAL behind a build flag</text>

  
  <rect class="gimod-band" x="12" y="510" width="562" height="38" rx="6" />
  <text class="gimod-s" x="22" y="534">Hardware</text>
  <rect class="gimod-hw" x="262" y="516" width="96" height="26" rx="6" /><text class="gimod-c" x="310" y="533">CPU</text>
  <rect class="gimod-hw" x="366" y="516" width="96" height="26" rx="6" /><text class="gimod-c" x="414" y="533">GPU</text>
  <rect class="gimod-hw" x="470" y="516" width="96" height="26" rx="6" /><text class="gimod-c" x="518" y="533">ASIC</text>
  <text class="gimod-n" x="586" y="524">supported CPUs and GPUs</text>
  <text class="gimod-n" x="586" y="538">through device interfaces</text>

  
  <rect class="gimod-rep" x="12" y="562" width="26" height="14" rx="7" /><text class="gimod-leg" x="44" y="573">program representations and artifacts</text>
  <rect class="gimod-box" x="262" y="562" width="26" height="14" rx="3" /><text class="gimod-leg" x="294" y="573">compiler and runtime facilities</text>
  <rect class="gimod-hw" x="482" y="562" width="26" height="14" rx="3" /><text class="gimod-leg" x="514" y="573">hardware</text>
  <text class="gimod-leg" x="12" y="591">The colour reading is our inference from the documentation’s diagram; the document itself does not state it.</text>
</svg>
