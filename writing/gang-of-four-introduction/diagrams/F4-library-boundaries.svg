<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 598" width="100%" role="img" aria-labelledby="gi2-title gi2-desc" fill="currentColor" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="gi2-title">What crosses a library boundary</title><desc id="gi2-desc">Four rows distinguish C++ definitions and objects, Rust rlib metadata and MIR, Lean cached elaborated environments, and Mojo code for consumer elaboration or MAX MEF executables. Corresponding later steps are instantiation and linking, code generation, environment import with separate rechecking, and elaboration or cached executable loading. This is not a timeline or an ordering of languages.</desc><defs><style>.gi2-title{font-size:23px;font-weight:650} .gi2-head{font-size:17px;font-weight:650;fill:#159bc7} .gi2-body{font-size:15px} .gi2-small{font-size:13px;opacity:.8} .gi2-gold{fill:#ad7d13} .gi2-box{fill:rgba(128,128,128,.07);stroke:currentColor;stroke-opacity:.4;stroke-width:1.2} .gi2-blue{fill:rgba(31,168,214,.08);stroke:#159bc7;stroke-width:1.3} .gi2-proposal{fill:rgba(184,134,11,.06);stroke:#ad7d13;stroke-dasharray:7 5;stroke-width:1.4} .gi2-line{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.65}</style><marker id="gi2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/></marker></defs><text class="gi2-title" x="20" y="32">What crosses a library boundary</text><text class="gi2-small" x="20" y="58">Typical mechanisms; these rows do not rank when each language checks a program.</text><text class="gi2-small" x="34" y="95">LANGUAGE</text><text class="gi2-small" x="234" y="95">RETAINED ARTIFACT</text><text class="gi2-small" x="524" y="95">WHAT A LATER STEP DOES</text><rect class="gi2-box" x="20" y="111" width="920" height="82" rx="7"/><text class="gi2-head" x="34" y="145">C++</text><text class="gi2-body" x="234" y="142">Template definitions and</text><text class="gi2-body" x="234" y="165">compiled object code</text><text class="gi2-body" x="524" y="142">Consumers instantiate templates;</text><text class="gi2-body" x="524" y="166">the native linker selects symbols.</text><rect class="gi2-box" x="20" y="207" width="920" height="82" rx="7"/><text class="gi2-head" x="34" y="241">Rust</text><text class="gi2-body" x="234" y="238">Object code and rlib metadata,</text><text class="gi2-body" x="234" y="261">including needed MIR</text><text class="gi2-body" x="524" y="238">Consumers generate instances and inlineable code;</text><text class="gi2-body" x="524" y="262">staticlib and cdylib are separate artifact choices.</text><rect class="gi2-box" x="20" y="303" width="920" height="82" rx="7"/><text class="gi2-head" x="34" y="337">Lean</text><text class="gi2-body" x="234" y="334">Elaborated environment (.olean)</text><text class="gi2-body" x="234" y="357">and separately compiled code</text><text class="gi2-body" x="524" y="334">Import loads the environment; rechecking is separate.</text><text class="gi2-body" x="524" y="358">The native implementation has additional obligations.</text><rect class="gi2-box" x="20" y="399" width="920" height="82" rx="7"/><text class="gi2-head" x="34" y="433">Mojo / MAX</text><text class="gi2-body" x="234" y="430">Mojo code for elaboration;</text><text class="gi2-body" x="234" y="453">MEF executables in MAX</text><text class="gi2-body" x="524" y="430">A consumer or MAX graph compilation specializes code.</text><text class="gi2-body" x="524" y="454">Cached or precompiled MEF can bypass fresh compilation.</text><rect class="gi2-blue" x="20" y="516" width="920" height="63" rx="7"/><text class="gi2-body" x="38" y="543">Evidence must identify the artifact selected and the assumptions of the check.</text><text class="gi2-small" x="38" y="566">Static linking, module import, consumer compilation and runtime loading are different events.</text></svg>