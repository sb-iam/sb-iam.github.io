<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 594" width="100%" role="img" aria-labelledby="gi4-title gi4-desc" fill="currentColor" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="gi4-title">MAX graph compilation and inference execution</title><desc id="gi4-desc">A Python graph interface feeds the C++ graph compiler. The graph compiler transforms the graph, selects kernels, emits Mojo and invokes the Mojo compiler within graph compilation. The resulting MEF bytes go to the runtime. Cached and supplied precompiled MEF are alternative inputs that bypass fresh compilation. Runtime device support depends on supported hardware, operations and models. </desc><defs><style>.gi4-title{font-size:23px;font-weight:650} .gi4-head{font-size:17px;font-weight:650;fill:#159bc7} .gi4-body{font-size:15px} .gi4-small{font-size:13px;opacity:.8} .gi4-gold{fill:#ad7d13} .gi4-box{fill:rgba(128,128,128,.07);stroke:currentColor;stroke-opacity:.4;stroke-width:1.2} .gi4-blue{fill:rgba(31,168,214,.08);stroke:#159bc7;stroke-width:1.3} .gi4-proposal{fill:rgba(184,134,11,.06);stroke:#ad7d13;stroke-dasharray:7 5;stroke-width:1.4} .gi4-line{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.65}</style><marker id="gi4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/></marker></defs><text class="gi4-title" x="20" y="32">MAX: graph compilation and inference execution</text><text class="gi4-small" x="20" y="58">Simplified from the examined implementation; support depends on the target and model.</text><rect class="gi4-box" x="20" y="88" width="240" height="109" rx="7"/><text class="gi4-head" x="36" y="118">Python graph interface</text><text class="gi4-body" x="36" y="148">Construct the computation</text><text class="gi4-body" x="36" y="171">Supply graph and target</text><path class="gi4-line" d="M260,142 L318,142" marker-end="url(#gi4-arrow)"/><rect class="gi4-blue" x="320" y="88" width="620" height="210" rx="7"/><text class="gi4-head" x="338" y="118">Graph compiler · C++ infrastructure</text><text class="gi4-body" x="338" y="148">Transform the graph and select compatible kernels</text><text class="gi4-body" x="338" y="171">Emit Mojo and invoke the Mojo compiler within graph compilation</text><rect class="gi4-box" x="340" y="209" width="580" height="64" rx="7"/><text class="gi4-head" x="356" y="235">Mojo kernels and generated code</text><text class="gi4-body" x="356" y="258">Parameters specialize computation for the selected processor.</text><path class="gi4-line" d="M630,298 L630,348" marker-end="url(#gi4-arrow)"/><rect class="gi4-box" x="320" y="350" width="620" height="73" rx="7"/><text class="gi4-head" x="338" y="380">MEF · Modular Executor Format</text><text class="gi4-body" x="338" y="404">Compiled executable bytes accepted by the runtime</text><rect class="gi4-box" x="20" y="320" width="240" height="103" rx="7"/><text class="gi4-head" x="36" y="350">Other load paths</text><text class="gi4-body" x="36" y="380">Cached MEF</text><text class="gi4-body" x="36" y="403">Supplied precompiled MEF</text><path class="gi4-line" d="M260,386 L318,386" marker-end="url(#gi4-arrow)"/><path class="gi4-line" d="M630,423 L630,463" marker-end="url(#gi4-arrow)"/><rect class="gi4-box" x="320" y="465" width="620" height="76" rx="7"/><text class="gi4-head" x="338" y="495">Runtime and device support</text><text class="gi4-body" x="338" y="520">Execute on supported CPUs and GPUs, subject to hardware and model limits.</text><text class="gi4-small" x="20" y="574">Inference execution on supported CPUs and GPUs.</text></svg>