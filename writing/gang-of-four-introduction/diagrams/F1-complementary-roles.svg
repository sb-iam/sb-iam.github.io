<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 441" width="100%" role="img" aria-labelledby="gi1-title gi1-desc" fill="currentColor" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="gi1-title">Complementary roles for a verification architecture</title><desc id="gi1-desc">Rust handles orchestration, Lean formal reasoning and Mojo numerical computation in the architecture proposed here. These are overlapping roles. A separate C-interface band names calling conventions and data-layout obligations. C++ provides shared native infrastructure.</desc><defs><style>.gi1-title{font-size:23px;font-weight:650} .gi1-head{font-size:17px;font-weight:650;fill:#159bc7} .gi1-body{font-size:15px} .gi1-small{font-size:13px;opacity:.8} .gi1-gold{fill:#ad7d13} .gi1-box{fill:rgba(128,128,128,.07);stroke:currentColor;stroke-opacity:.4;stroke-width:1.2} .gi1-blue{fill:rgba(31,168,214,.08);stroke:#159bc7;stroke-width:1.3} .gi1-proposal{fill:rgba(184,134,11,.06);stroke:#ad7d13;stroke-dasharray:7 5;stroke-width:1.4} .gi1-line{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.65}</style><marker id="gi1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor" /></marker></defs><text class="gi1-title" x="20" y="32">Complementary roles for a verification architecture</text><text class="gi1-small" x="20" y="58">The roles are assigned here; they are not exclusive capabilities of the languages.</text><rect class="gi1-box" x="20" y="85" width="280" height="142" rx="7" /><text class="gi1-head" x="36" y="114">Rust · orchestration</text><text class="gi1-body" x="36" y="144">Requests, resources and services</text><text class="gi1-body" x="36" y="167">Ownership checks and async</text><text class="gi1-body" x="36" y="190">Can also implement computation</text><rect class="gi1-box" x="340" y="85" width="280" height="142" rx="7" /><text class="gi1-head" x="356" y="114">Lean · formal reasoning</text><text class="gi1-body" x="356" y="144">Definitions, assumptions and proofs</text><text class="gi1-body" x="356" y="167">Checks the stated proposition</text><text class="gi1-body" x="356" y="190">Execution needs its own evidence</text><rect class="gi1-box" x="660" y="85" width="280" height="142" rx="7" /><text class="gi1-head" x="676" y="114">Mojo · computation</text><text class="gi1-body" x="676" y="144">Parameterized numerical kernels</text><text class="gi1-body" x="676" y="167">Specialization for selected targets</text><text class="gi1-body" x="676" y="190">Public async remains under design</text><rect class="gi1-blue" x="20" y="255" width="920" height="70" rx="7" /><text class="gi1-head" x="38" y="282">C interfaces · one interoperability choice</text><text class="gi1-body" x="38" y="307">Calling conventions and data layout do not establish ownership contracts or transfer proofs.</text><rect class="gi1-box" x="20" y="347" width="920" height="74" rx="7" /><text class="gi1-head" x="38" y="374">Shared C++ infrastructure</text><text class="gi1-body" x="38" y="399">LLVM, Clang and MLIR; compiler and runtime components; existing native and accelerator libraries.</text></svg>